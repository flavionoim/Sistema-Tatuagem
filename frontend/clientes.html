<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Clientes — Estúdio de Tatuagem</title>
  <link rel="stylesheet" href="../Global.css">
</head>
<body>
  <nav>
    <div>
      <span>Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="senioridade.html">Senioridade</a>
        <a href="estilos.html">Estilos</a>
        <a href="tatuadores.html">Tatuadores</a>
        <a href="agendamentos.html">Agendamentos</a>
        <button onclick="sair()">Sair</button>
      </div>
    </div>
  </nav>

  <div class="div-container">
    <h1>Clientes</h1>

    <form id="form-cliente">
      <div>
        <input type="text" id="nome" placeholder="Nome" required>
      </div>
      <div>
        <input type="text" id="cpf" placeholder="CPF (só números)" required>
      </div>
      <div>
        <input type="text" id="telefone" placeholder="Telefone">
      </div>
      <div>
        <input type="text" id="cidade" placeholder="Cidade">
      </div>
      <div>
        <input type="text" id="uf" placeholder="UF" maxlength="2">
      </div>
      <div>
        <button id="btn-submit-cliente" type="submit">Cadastrar</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>Telefone</th>
          <th>Cidade</th>
          <th>UF</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
      </tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>

</body>
</html>
