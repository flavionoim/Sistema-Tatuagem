<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Clientes — Estúdio de Tatuagem</title>
</head>
<body class="">
  <nav class="">
    <div class="">
      <span class="">Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html" class="">Dashboard</a>
        <a href="clientes.html" class="">Clientes</a>
        <a href="senioridade.html" class="">Senioridade</a>
        <a href="estilos.html" class="">Estilos</a>
        <a href="tatuadores.html" class="">Tatuadores</a>
        <a href="agendamentos.html" class="">Agendamentos</a>
        <button onclick="sair()" class="">Sair</button>
      </div>
    </div>
  </nav>
  <h1>Clientes</h1>

  <!-- Formulário para cadastrar novo cliente -->
  <form id="form-cliente" class="">
    <div class="">
      <input type="text" id="nome" class="" placeholder="Nome" required>
    </div>
    <div class="">
      <input type="text" id="cpf" class="" placeholder="CPF (só números)" required>
    </div>
    <div class="">
      <input type="text" id="telefone" class="" placeholder="Telefone">
    </div>
    <div class="">
      <input type="text" id="cidade" class="" placeholder="Cidade">
    </div>
    <div class="">
      <input type="text" id="uf" class="" placeholder="UF" maxlength="2">
    </div>
    <div class="">
      <button id="btn-submit-cliente" type="submit" class="">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os clientes vão aparecer -->
  <table class="">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>Telefone</th>
        <th>Cidade</th>
        <th>UF</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os clientes vão aparecer aqui -->
    </tbody>
  </table>

  <script src="js/auth.js"></script>
  <script src="js/clientes.js"></script>

</body>
</html>
