<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Estúdio de Tatuagem</title>
</head>
<body class="">

  <h1 class="">Criar conta</h1>

  <form id="form-cadastro" class="">
    <div class="">
      <input type="text" id="nome" class="" placeholder="Nome" required>
    </div>
    <div class="">
      <input type="email" id="email" class="" placeholder="E-mail" required>
    </div>
    <div class="">
      <input type="password" id="senha" class="" placeholder="Senha" required>
    </div>
    <button type="submit" class="">Cadastrar</button>
  </form>

  <p class="">
    Já tem conta? <a href="login.html">Entrar</a>
  </p>

  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
