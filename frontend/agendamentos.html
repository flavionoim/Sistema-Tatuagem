<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link rel="stylesheet" href="../Global.css">
</head>

<body class="">

  <nav class="">
    <div class="">
      <span class="">Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html" class="">Dashboard</a>
        <a href="clientes.html" class="">Clientes</a>
        <a href="senioridade.html" class="">Senioridade</a>
        <a href="estilos.html" class="">Estilos</a>
        <a href="tatuadores.html" class="">Tatuadores</a>
        <a href="agendamentos.html" class="">Agendamentos</a>
        <button onclick="sair()" class="">Sair</button>
      </div>
    </div>
  </nav>

  <div class="">
    <h1>Agendamentos</h1>

    <!-- Formulário para cadastrar novo agendamento -->
    <form id="form-agendamento" class="">
      <div class="">
        <select id="idcliente" class="" required>
          <option value="">Cliente...</option>
        </select>
      </div>
      <div class="">
        <select id="idtatuador" class="" required>
          <option value="">Tatuador...</option>
        </select>
      </div>
      <div class="">
        <input type="date" id="dataagendamento" class="" required>
      </div>
      <div class="">
        <input type="time" id="horaagendamento" class="" required>
      </div>
      <div class="">
        <input type="number" id="valortatuagem" class="" placeholder="Valor (R$)" step="0.01" min="0">
      </div>
      <div class="">
        <textarea id="descricaotatuagem" class="" placeholder="Descrição da tatuagem"></textarea>
      </div>
      <div class="">
        <label class="">Desenho aprovado (imagem)</label>
        <input type="file" id="desenho" class="" accept="image/*">
      </div>

      <!-- Esse bloco começa escondido — só aparece quando estamos editando um agendamento existente -->
      <div class="" id="bloco-status" style="display: none;">
        <select id="status" class="">
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <div class="">
        <button id="btn-submit-agendamento" type="submit" class="">Cadastrar</button>
      </div>
    </form>

    <!-- Tabela onde os agendamentos vão aparecer -->
    <table class="">
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Tatuador</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Desenho</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <!-- os agendamentos vão aparecer aqui -->
      </tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>

</body>

</html>
