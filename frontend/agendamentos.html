<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link rel="stylesheet" href="../Global.css">
</head>
<body>

  <nav>
    <div>
      <span>Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="senioridade.html">Senioridade</a>
        <a href="estilos.html">Estilos</a>
        <a href="tatuadores.html">Tatuadores</a>
        <a href="agendamentos.html">Agendamentos</a>
        <button onclick="sair()">Sair</button>
      </div>
    </div>
  </nav>

  <div class="div-container">
    <h1>Agendamentos</h1>

    <form id="form-agendamento">
      <div>
        <select id="idcliente" required>
          <option value="">Cliente...</option>
        </select>
      </div>
      <div>
        <select id="idtatuador" required>
          <option value="">Tatuador...</option>
        </select>
      </div>
      <div>
        <input type="date" id="dataagendamento" required>
      </div>
      <div>
        <input type="time" id="horaagendamento" required>
      </div>
      <div>
        <input type="number" id="valortatuagem" placeholder="Valor (R$)" step="0.01" min="0">
      </div>
      <div>
        <textarea id="descricaotatuagem" placeholder="Descrição da tatuagem"></textarea>
      </div>
      <div>
        <label style="color: #c4c4cc; font-size: 0.9rem;">Desenho aprovado (imagem)</label>
        <input type="file" id="desenho" accept="image/*">
      </div>

      <div id="bloco-status" style="display: none;">
        <select id="status">
          <option value="pendente">Pendente</option>
          <option value="confirmado">Confirmado</option>
          <option value="concluido">Concluído</option>
          <option value="cancelado">Cancelado</option>
        </select>
      </div>

      <div>
        <button id="btn-submit-agendamento" type="submit">Cadastrar</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Cliente</th>
          <th>Tatuador</th>
          <th>Data</th>
          <th>Hora</th>
          <th>Valor</th>
          <th>Status</th>
          <th>Desenho</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
      </tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>

</body>
</html>
