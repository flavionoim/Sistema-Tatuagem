<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link rel="stylesheet" href="../Global.css">
</head>
<body>
  <nav>
    <div>
      <span>Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="clientes.html">Clientes</a>
        <a href="senioridade.html">Senioridade</a>
        <a href="estilos.html">Estilos</a>
        <a href="tatuadores.html">Tatuadores</a>
        <a href="agendamentos.html">Agendamentos</a>
        <button onclick="sair()">Sair</button>
      </div>
    </div>
  </nav>

  <div class="div-container">
    <h1>Tatuadores</h1>

    <form id="form-tatuador">
      <div>
        <input type="text" id="nometatuador" placeholder="Nome" required>
      </div>
      <div>
        <input type="text" id="cpf" placeholder="CPF (só números)" required>
      </div>
      <div>
        <input type="email" id="email" placeholder="E-mail">
      </div>
      <div>
        <input type="text" id="telefone" placeholder="Telefone">
      </div>
      <div>
        <select id="idsenioridade" required>
          <option value="">Senioridade...</option>
        </select>
      </div>
      <div style="grid-column: 1 / -1;">
        <label style="color: #c4c4cc; font-size: 0.9rem;">Estilos que domina</label>
        <div id="lista-estilos" style="display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px;">
        </div>
      </div>
      <div>
        <button id="btn-submit-tatuador" type="submit">Cadastrar</button>
      </div>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>CPF</th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Senioridade</th>
          <th>Estilos</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
      </tbody>
    </table>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
