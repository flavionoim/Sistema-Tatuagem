<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
</head>
<body class="">
  <nav class="">
    <div class="">
      <span class="">Estúdio de Tatuagem</span>
      <div>
        <a href="dashboard.html" class="">Dashboard</a>
        <a href="clientes.html" class="">Clientes</a>
        <a href="senioridade.html" class="">Senioridade</a>
        <a href="estilos.html" class="">Estilos</a>
        <a href="tatuadores.html" class="">Tatuadores</a>
        <a href="agendamentos.html" class="">Agendamentos</a>
        <button onclick="sair()" class="">Sair</button>
      </div>
    </div>
  </nav>
  <h1>Tatuadores</h1>

  <!-- Formulário para cadastrar novo tatuador -->
  <form id="form-tatuador" class="">
    <div class="">
      <input type="text" id="nometatuador" class="" placeholder="Nome" required>
    </div>
    <div class="">
      <input type="text" id="cpf" class="" placeholder="CPF (só números)" required>
    </div>
    <div class="">
      <input type="email" id="email" class="" placeholder="E-mail">
    </div>
    <div class="">
      <input type="text" id="telefone" class="" placeholder="Telefone">
    </div>
    <div class="">
      <select id="idsenioridade" class="" required>
        <option value="">Senioridade...</option>
        <!-- as opções são preenchidas pelo JavaScript -->
      </select>
    </div>

    <div class="">
      <button id="btn-submit-tatuador" type="submit" class="">Cadastrar</button>
    </div>

    <div class="">
      <label class="">Estilos que domina</label>
      <div id="lista-estilos" class="">
        <!-- os checkboxes são preenchidos pelo JavaScript -->
      </div>
    </div>
  </form>

  <!-- Tabela onde os tatuadores vão aparecer -->
  <table class="">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Estilos</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os tatuadores vão aparecer aqui -->
    </tbody>
  </table>

  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
